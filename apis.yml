    social posts from text. Everything runs asynchronously: create a generation,
    poll for status, and retrieve the result (gammaUrl, exportUrl, gammaId).
    Endpoints cover generation from scratch and from templates, export, themes,
    folders, document/card/viewer analytics, comments, archive, and delete.
