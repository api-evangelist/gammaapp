aid: gammaapp
name: Gamma.app
description: >-
  Gamma (Gamma Tech, Inc.) is an AI-powered platform for generating polished
  presentations, documents, websites, and social media posts from text prompts.
  Its public REST API (base https://public-api.gamma.app/v1.0) lets developers
  programmatically create gammas from scratch or from an existing template, poll
  asynchronous generation jobs, export to PDF/PPTX/PNG, manage themes and
  folders, retrieve document- and card-level analytics, and archive or delete
  documents. Gamma also runs an official hosted Model Context Protocol (MCP)
  server at mcp.gamma.app secured with OAuth 2.0 and Dynamic Client Registration
  that powers its ChatGPT and Claude connectors, alongside native Zapier, Make,
  and n8n integrations. API key access requires a Pro, Ultra, Teams, or Business
  plan and uses credit-based billing.
