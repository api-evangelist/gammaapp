schemes:
- name: ApiKeyAuth
  type: apiKey
  in: header
  parameter_name: X-API-KEY
  key_prefix: sk-gamma-
  surface: REST API (https://public-api.gamma.app/v1.0)
  plans: [Pro, Ultra, Teams, Business]
  provisioning: https://gamma.app/settings/api-keys
  notes: >-
    All REST requests require an API key in the case-sensitive X-API-KEY header.
    Keys start with sk-gamma-. Invalid/missing keys return 401 "Invalid API key".
- name: OAuth2
  type: oauth2
  scheme: bearer
  surface: Gamma MCP server (https://mcp.gamma.app/mcp)
  authorization_server: https://auth.gamma.app
  protected_resource_metadata: https://mcp.gamma.app/.well-known/oauth-protected-resource
  dynamic_client_registration: true
  specs: [RFC 9728, RFC 7591]
  scopes: [generate, 'gamma:read']
  notes: >-
    The hosted MCP server (and the ChatGPT/Claude connectors it powers) uses
    OAuth 2.0 Bearer tokens with Dynamic Client Registration. Available on all
    plans.
